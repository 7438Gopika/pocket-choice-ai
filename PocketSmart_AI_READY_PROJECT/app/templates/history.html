{% extends "base.html" %}{% block title %}History{% endblock %}{% block content %}<section class="head"><small>YOUR HISTORY</small><h1>Past recommendation plans.</h1></section><div id="history" class="list">Loading…</div><div id="detail" class="panel hidden"></div>{% endblock %}{% block scripts %}<script>async function load(){let x=await api('/history');history.innerHTML=x.length?x.map(r=>`<button class="row" onclick="detailOf(${r.id})"><b>${esc(r.planner)}</b><strong>${esc(r.title)}</strong><time>${new Date(r.created_at).toLocaleString()}</time></button>`).join(''):'<p>No history yet.</p>'}async function detailOf(id){let x=await api('/recommendations-details/'+id);detail.classList.remove('hidden');detail.innerHTML=`<small>${esc(x.planner)}</small><h2>${esc(x.title)}</h2><p>${esc(x.response.summary)}</p>`+resultHtml(x.response)}load()</script>{% endblock %}
