{% extends "base.html" %}{% block title %}Home Planner{% endblock %}{% block content %}<section class="head"><small>HOME INTERIOR</small><h1>Build your room plan.</h1><p>Room + budget + style + required items.</p></section><div class="planner"><form id="form" class="panel"><label>Room<select id="room_type"><option>Living Room</option><option>Kitchen</option><option>Bedroom</option><option>Dining Room</option><option>Home Office</option><option>Other</option></select></label><label>Budget (₹)<input id="budget" type="number" min="1" required></label><label>Style<input id="style" value="modern"></label><label>Notes<textarea id="notes"></textarea></label><div class="items-head"><b>Required items</b><button type="button" onclick="addItem()">+ Add</button></div><div id="items"></div><div id="error" class="error hidden"></div><button class="btn full">Generate Home Plan</button></form><section id="results" class="panel empty">Your recommendations will appear here.</section></div>{% endblock %}{% block scripts %}<script>function addItem(n='Sofa',q=1){let d=document.createElement('div');d.className='item';d.innerHTML=`<input class="n" value="${esc(n)}" required><input class="q" type="number" min="1" value="${q}" required><button type="button" onclick="this.parentElement.remove()">×</button>`;items.appendChild(d)}addItem();addItem('Lamp',2);form.onsubmit=async e=>{e.preventDefault();busy(1);try{let p={room_type:room_type.value,budget:+budget.value,style:style.value,notes:notes.value,items:[...document.querySelectorAll('.item')].map(x=>({name:x.querySelector('.n').value,quantity:+x.querySelector('.q').value}))};render(await api('/generate-home',{method:'POST',body:JSON.stringify(p)}))}catch(x){error.textContent=x.message;error.classList.remove('hidden')}finally{busy(0)}}</script>{% endblock %}
