{% extends "base.html" %}{% block title %}Jewelry Planner{% endblock %}{% block content %}<section class="head"><small>JEWELRY MATCH</small><h1>Find pieces that fit the moment.</h1><p>Optionally upload an outfit image for visual coordination guidance.</p></section><div class="planner"><form id="form" class="panel"><label>Budget (₹)<input id="budget" type="number" min="1" required></label><label>Occasion<input id="occasion" value="wedding" required></label><label>Style<input id="style" value="elegant"></label><label>Metal<input id="metal_preference" value="any"></label><label>Outfit image<input id="outfit_image" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Notes<textarea id="notes"></textarea></label><div id="error" class="error hidden"></div><button class="btn full">Generate Jewelry Plan</button></form><section id="results" class="panel empty">Your recommendations will appear here.</section></div>{% endblock %}{% block scripts %}<script>form.onsubmit=async e=>{e.preventDefault();busy(1);try{let f=new FormData();['budget','occasion','style','metal_preference','notes'].forEach(k=>f.append(k,document.getElementById(k).value));if(outfit_image.files[0])f.append('outfit_image',outfit_image.files[0]);render(await api('/generate-jewelry',{method:'POST',body:f}))}catch(x){error.textContent=x.message;error.classList.remove('hidden')}finally{busy(0)}}</script>{% endblock %}
