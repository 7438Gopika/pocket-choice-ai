{% extends "base.html" %}{% block title %}Login{% endblock %}{% block content %}<div class="auth"><form id="form" class="panel"><small>WELCOME BACK</small><h1>Sign in</h1><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><div id="error" class="error hidden"></div><button class="btn full">Sign in</button><p>New here? <a href="/register">Create an account</a></p></form></div>{% endblock %}{% block scripts %}<script>form.onsubmit=async e=>{e.preventDefault();try{await api('/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});location='/dashboard'}catch(x){error.textContent=x.message;error.classList.remove('hidden')}}</script>{% endblock %}
