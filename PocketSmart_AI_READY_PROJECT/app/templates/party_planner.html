{% extends "base.html" %}{% block title %}Party Planner{% endblock %}{% block content %}<section class="head"><small>PARTY PLANNER</small><h1>Make the budget do the work.</h1><p>Plan catering, venue and decoration around your guest count.</p></section><div class="planner"><form id="form" class="panel"><label>Budget (₹)<input id="budget" type="number" min="1" required></label><label>Guests<input id="guest_count" type="number" min="1" required></label><label>Event type<input id="event_type" value="birthday" required></label><label>Venue<input id="venue" value="home"></label><label>Food preference<input id="food_preference" value="vegetarian"></label><label>Theme<input id="theme" value="pastel"></label><label>Notes<textarea id="notes"></textarea></label><div id="error" class="error hidden"></div><button class="btn full">Generate Party Plan</button></form><section id="results" class="panel empty">Your recommendations will appear here.</section></div>{% endblock %}{% block scripts %}<script>form.onsubmit=async e=>{e.preventDefault();busy(1);try{render(await api('/generate-party',{method:'POST',body:JSON.stringify({budget:+budget.value,guest_count:+guest_count.value,event_type:event_type.value,venue:venue.value,food_preference:food_preference.value,theme:theme.value,notes:notes.value})}))}catch(x){error.textContent=x.message;error.classList.remove('hidden')}finally{busy(0)}}</script>{% endblock %}
