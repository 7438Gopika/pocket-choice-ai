{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}<div class="auth"><form id="form" class="panel"><small>GET STARTED</small><h1>Create account</h1><label>Full name<input id="full_name" required maxlength="120"></label><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="8" required></label><div id="error" class="error hidden"></div><button class="btn full">Create account</button><p>Already registered? <a href="/login">Sign in</a></p></form></div>{% endblock %}{% block scripts %}<script>form.onsubmit=async e=>{e.preventDefault();try{await api('/register',{method:'POST',body:JSON.stringify({full_name:full_name.value,email:email.value,password:password.value})});location='/dashboard'}catch(x){error.textContent=x.message;error.classList.remove('hidden')}}</script>{% endblock %}
